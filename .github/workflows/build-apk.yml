
name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install packages
        run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html admob.config.json www/
      - name: Create Android project
        run: |
          npx cap add android
          node patch-manifest.js
          npx cap sync android
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias gcm --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out GrandCricketManager.apk aligned.apk
          $BT/apksigner verify --print-certs GrandCricketManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GrandCricketManager-apk
          path: GrandCricketManager.apk
